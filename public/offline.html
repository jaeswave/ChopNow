<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E3B2C" />
    <title>You are offline | GbaanJo</title>
    <link rel="icon" href="/icons/favicon-32.png" />
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        background: #0E3B2C; color: #fff; text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      img { width: 96px; height: 96px; border-radius: 24px; }
      h1 { font-size: 1.75rem; margin: 20px 0 8px; }
      p { max-width: 22rem; margin: 0 auto; line-height: 1.5; color: rgba(255, 255, 255, 0.85); }
      button {
        margin-top: 24px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 12px;
        background: #F4B52E; color: #2a1d00; font-size: 1rem; font-weight: 700; cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>GbaanJo needs the internet to show live deals and your orders. Check your data or Wi-Fi, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
